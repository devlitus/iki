<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IKI</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&display=swap" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <h1>IKI</h1>
        <button type="button" class="btn" id="open-steps" aria-controls="steps" aria-expanded="false">Pasos de preparación</button>
        <button type="button" class="btn" id="reroll" title="Nueva preparación con los mismos jugadores">Volver a tirar dados</button>
        <button type="button" class="btn" id="open-picker">Jugadores (J)</button>
        <span class="spacer"></span>
        <span class="hint">Rueda: zoom · Arrastrar: mover · Doble clic: encajar · Alt + clic: coordenadas · Z: zonas</span>
      </header>
      <section id="decks"></section>
      <article id="seat-top" class="seat" hidden></article>
      <article id="seat-left" class="seat" hidden></article>
      <main id="viewport">
        <div id="board">
          <img id="board-image" src="/textures/tablero-iki.jpg" alt="Tablero de IKI" draggable="false" />
          <div id="pieces"></div>
        </div>
        <div id="toast" hidden></div>
      </main>
      <article id="seat-right" class="seat" hidden></article>
      <article id="seat-bottom" class="seat" hidden></article>
      <aside id="side"></aside>
    </div>
    <nav id="steps" aria-label="Pasos de preparación"></nav>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
