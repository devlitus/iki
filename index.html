<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IKI</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&display=swap" />
  </head>
  <body>
    <div id="app">
      <aside id="side">
        <header id="toolbar">
          <h1>IKI</h1>
          <button type="button" class="btn" id="open-steps" aria-controls="steps" aria-expanded="false">Pasos de preparación</button>
          <button type="button" class="btn" id="reroll" title="Nueva preparación con los mismos jugadores">Volver a tirar dados</button>
          <button type="button" class="btn" id="open-picker">Jugadores (J)</button>
        </header>
        <section id="decks" class="panel"></section>
        <div id="supply"></div>
        <p class="hint">Rueda: zoom · Arrastrar: mover · Doble clic: encajar · Alt + clic: coordenadas · Z: zonas</p>
      </aside>
      <main id="viewport">
        <div id="board">
          <img id="board-image" src="/textures/tablero-iki.jpg" alt="Tablero de IKI" draggable="false" />
          <div id="pieces"></div>
        </div>
        <div id="toast" hidden></div>
      </main>
      <section id="players" aria-label="Jugadores"></section>
    </div>
    <nav id="steps" aria-label="Pasos de preparación"></nav>
    <div id="rotate-hint" role="alert">
      <div class="phone" aria-hidden="true"></div>
      <p>Gira el móvil: IKI se juega en horizontal.</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
