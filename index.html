<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IKI</title>
    <meta name="theme-color" content="#5a3720" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <!-- iPhone: instalada en la pantalla de inicio se abre sin las barras de Safari (ver src/view/fullscreen.js) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IKI" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&display=swap" />
  </head>
  <body>
    <div id="app">
      <nav id="rail" aria-label="Paneles">
        <button type="button" data-rail="side" aria-expanded="false" title="Mesa: mazos, fila de personajes, edificios y reserva">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="10" height="14" rx="1.5"/><path d="M8 3h10.5A1.5 1.5 0 0 1 20 4.5V17"/></svg><span>Mesa</span></button>
        <button type="button" data-rail="players" aria-expanded="false" title="Jugadores">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.3c3 .1 5.5 2.4 5.5 5.7"/></svg><span>Jugad.</span></button>
        <button type="button" data-rail="turn" aria-expanded="true" title="Mostrar u ocultar el panel de turno" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>Turno</span></button>
        <button type="button" data-rail="fullscreen" aria-pressed="false" title="Pantalla completa" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span>Pantalla</span></button>
        <button type="button" data-rail="menu" title="Menú">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18.5" r="1.5"/></svg><span>Menú</span></button>
      </nav>
      <aside id="side">
        <header id="toolbar">
          <h1>IKI</h1>
          <button type="button" class="btn" id="open-steps" aria-controls="steps" aria-expanded="false">Pasos de preparación</button>
          <button type="button" class="btn" id="reroll" title="Nueva preparación con los mismos jugadores">Volver a tirar dados</button>
          <button type="button" class="btn" id="open-picker">Jugadores (J)</button>
          <button type="button" class="btn" id="open-menu">Menú</button>
        </header>
        <section id="turn" class="panel" aria-live="polite" hidden></section>
        <section id="decks" class="panel"></section>
        <div id="supply"></div>
        <p class="hint">Rueda: zoom · Arrastrar: mover · Doble clic: encajar · Alt + clic: coordenadas · Z: zonas</p>
      </aside>
      <main id="viewport">
        <div id="board">
          <img id="board-image" src="/textures/tablero-iki.jpg" alt="Tablero de IKI" draggable="false" />
          <div id="pieces"></div>
        </div>
        <div id="toast" hidden></div>
      </main>
      <section id="players" aria-label="Jugadores"></section>
    </div>
    <section id="coach" aria-live="polite" hidden></section>
    <nav id="steps" aria-label="Pasos de preparación"></nav>
    <div id="rotate-hint" role="alert">
      <div class="phone" aria-hidden="true"></div>
      <p>Gira el móvil: IKI se juega en horizontal.</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
